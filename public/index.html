<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The title is set per screen in src/routes/pageMeta.ts. What is written here
         is what a visitor or a crawler sees before the app starts. -->
    <title>Climat</title>
    <meta
      name="description"
      content="Sign in to Climat, the origination workspace for carbon project developers: applicability checks, evidence gap reports and project documents with a citation on every claim."
    />
    <!-- The app is not meant to be found through search; the public site is. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0d5058" />
    <meta name="application-name" content="Climat" />
    <meta name="apple-mobile-web-app-title" content="Climat" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="32x32" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Climat" />
    <meta property="og:title" content="Climat: carbon project origination" />
    <meta
      property="og:description"
      content="The origination workspace for carbon project developers."
    />
    <meta property="og:image" content="https://climat.today/assets/og/climat-og.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <noscript>
      <h1>Climat</h1>
      <p>
        Climat is the origination workspace for carbon project developers. This
        application needs JavaScript to run. To read about Climat, visit
        <a href="https://climat.today/">climat.today</a>.
      </p>
    </noscript>
    <div id="root"></div>
  </body>
</html>
